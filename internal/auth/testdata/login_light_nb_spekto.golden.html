<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn – Testify</title>
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: url('/static/fjord-dawn.jpg') center/cover no-repeat fixed;
        }
        
        .card {
            background: transparent;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            width: 100%; max-width: 380px;
            margin: 1rem;
            position: relative;
        }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo-row {
            display: flex; align-items: center; justify-content: center; gap: .6rem;
        }
        .logo-row svg { width: 36px; height: 36px; }
        .logo h1 {
            
            font-family: 'Space Grotesk', 'DM Sans', sans-serif;
            font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -.02em;
            color: #243d32;
            
        }
        .logo p {
            
            font-size: .9rem; margin: .4rem 0 0; color: #59685e; font-weight: 400;
            
        }
        .btn-social {
            width: 100%; padding: .7rem; border: none;
            border-radius: 10px;
            font-size: .95rem; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: .5rem;
            text-decoration: none; font-weight: 500; margin-bottom: .5rem;
            
            font-family: 'DM Sans', sans-serif; font-weight: 600;
            background: white; color: #243d32; border: 1px solid #d9ded2;
            transition: all .15s;
            
        }
        .btn-social:hover {
            
            background: #f0e9dc; border-color: #9aa89e;
            
        }
        
        .divider {
            text-align: center; margin: 1.25rem 0; font-size: .8rem;
            display: flex; align-items: center; gap: .75rem;
            color: #7c8a80; font-family: 'DM Sans', sans-serif;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: #d9ded2;
        }
        
        .lang {
            position: absolute; left: 0; right: 0; top: 100%;
            margin-top: .75rem; text-align: center;
            font-size: .8rem; letter-spacing: .02em;
            font-family: 'DM Sans', sans-serif;
        }
        .lang a, .lang span { text-decoration: none; padding: 0 .2rem; }
        
        .lang a { color: #7c8a80; }
        .lang a:hover { color: #a9432c; }
        .lang .active { color: #243d32; font-weight: 600; }
        .lang .sep { color: #d9ded2; }
        
        .msg-error {
            padding: .6rem .75rem; border-radius: 6px; margin-bottom: 1rem;
            text-align: center; font-size: .9rem;
            
            font-family: 'DM Sans', sans-serif;
            color: #a9432c; background: #fbeae6; border: 1px solid #f0d3ca;
            
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            
            <h1>Testify</h1>
            
            
        </div>

        

        
        <a id="oidc-btn" href="/social-login?service=spekto" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.7 0 6.7 5.4 2.8 13.3l7.8 6C12.4 13 17.8 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.6 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.2-9.9 6.2-17z"/>
                <path fill="#FBBC05" d="M10.6 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.8 10.7l7.8-6z"/>
                <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.6-4.2-13.4-9.9l-7.8 6C6.7 42.6 14.7 48 24 48z"/>
            </svg>
            Fortsett med Google
        </a>
        

        
        <a id="ms-btn" href="/ms-oidc-login?service=spekto" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 21 21">
                <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Fortsett med Microsoft
        </a>
        

        
        <div class="divider">eller</div>
        <a id="magic-btn" href="/magic-login?service=spekto&amp;lang=nb" class="btn-social">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="#59685e"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M22 7l-10 7L2 7"/>
            </svg>
            Logg inn med e-postlenke
        </a>
        

        
        <div class="divider">eller</div>
        <form method="post" action="/do-login">
            <input type="hidden" name="service_id" value="spekto">
            <input type="email" name="email" placeholder="E-postadresse" required style="
                display:block;width:100%;padding:.7rem .85rem;margin-bottom:.5rem;font-size:.95rem;
                font-family:'DM Sans', sans-serif;
                border:1px solid #d9ded2;
                border-radius:10px;
                background:white;
                color:#243d32;"
                onfocus="this.style.outline='none';this.style.borderColor='#a9432c';this.style.boxShadow='0 0 0 3px rgba(169,67,44,.15)';" onblur="this.style.borderColor='#d9ded2';this.style.boxShadow='none';">
            <input type="password" name="password" placeholder="Passord" required style="
                display:block;width:100%;padding:.7rem .85rem;margin-bottom:.75rem;font-size:.95rem;
                font-family:'DM Sans', sans-serif;
                border:1px solid #d9ded2;
                border-radius:10px;
                background:white;
                color:#243d32;"
                onfocus="this.style.outline='none';this.style.borderColor='#a9432c';this.style.boxShadow='0 0 0 3px rgba(169,67,44,.15)';" onblur="this.style.borderColor='#d9ded2';this.style.boxShadow='none';">
            <button type="submit" style="
                width:100%;padding:.85rem 1.25rem;border:none;font-size:.95rem;cursor:pointer;
                font-family:'DM Sans', sans-serif;
                font-weight:700;
                border-radius:10px;
                background:#f47b64;
                transition:background .15s;
                color:#243329;"
                onmouseover="this.style.background='#f9917c';" onmouseout="this.style.background='#f47b64';">
                Logg inn
            </button>
        </form>
        

        <nav class="lang">
            <span class="active" lang="nb" title="Norsk">NO</span><span class="sep">·</span><a href="/login?lang=en&amp;service=spekto" hreflang="en" title="English">EN</a><span class="sep">·</span><a href="/login?lang=de&amp;service=spekto" hreflang="de" title="Deutsch">DE</a>
        </nav>
    </div>

    <script>
        (function() {
            var params = new URLSearchParams(location.search);
            
            
            
            
            
            
            if (params.get('response_type') === 'code' && params.get('client_id')) return;
            var redirectUri = params.get('redirect_uri');
            if (!redirectUri) return;
            document.cookie = 'redirect_uri=' + encodeURIComponent(redirectUri) +
                '; path=/; max-age=600; Secure; SameSite=Lax';
            var enc = encodeURIComponent(redirectUri);
            var oidcBtn = document.getElementById('oidc-btn');
            if (oidcBtn) oidcBtn.href = oidcBtn.href + '&redirect_uri=' + enc;
            var msBtn = document.getElementById('ms-btn');
            if (msBtn) msBtn.href = msBtn.href + '&redirect_uri=' + enc;
            var magicBtn = document.getElementById('magic-btn');
            if (magicBtn) magicBtn.href = magicBtn.href + '&redirect_uri=' + enc;
        })();
    </script>
</body>
</html>
